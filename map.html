<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보유 부동산 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eceee8;--pn:#fbfbf8;--ink:#22302a;--mut:#667068;--ln:#cdd3c8;--ac:#b3601a}
@media(prefers-color-scheme:dark){:root{--bg:#171c19;--pn:#202723;--ink:#e4e9e2;--mut:#98a39a;--ln:#38423b;--ac:#e2944f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 'Noto Sans KR',system-ui,sans-serif}
#app{display:grid;height:100%;grid-template-columns:1fr 8px var(--rw,340px);grid-template-rows:1fr 8px var(--lh,170px)}
#mapcell{grid-area:1/1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--pn)}
#sp2{grid-area:2/1;cursor:row-resize}#sp1{grid-area:1/2/4/3;cursor:col-resize}
#legend{grid-area:3/1;overflow:auto;padding:8px 12px;background:var(--pn);min-height:0}
#side{grid-area:1/3/4/4;overflow:auto;padding:12px;background:var(--pn);min-width:0}
.sp{background:var(--ln);touch-action:none}.sp:hover{background:var(--ac)}
@media(max-width:860px){#app{display:block;height:auto}.sp{display:none}#mapcell{height:62vh}#side,#legend{border-top:1px solid var(--ln)}}
#bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 8px;border-bottom:1px solid var(--ln)}
#bar input[type=text]{flex:1;min-width:150px}#mw{flex:1;display:flex;min-height:0}#map{flex:1;min-height:0;min-width:0}
#rg{width:200px;overflow:auto;border-right:1px solid var(--ln);padding:4px 0;font-size:12px;flex:none}
@media(max-width:860px){#mw{flex-direction:column}#rg{width:auto;max-height:24vh;border-right:0;border-bottom:1px solid var(--ln)}}
input,button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:4px 7px;min-width:0}
button{cursor:pointer;background:var(--pn)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=color]{padding:0;width:26px;height:22px;border:0;background:none}input[type=checkbox]{width:auto}
h3{margin:0 0 4px;font-size:14px}h4{margin:14px 0 4px;font-size:13px;border-bottom:1px solid var(--ln);padding-bottom:2px}
.m{color:var(--mut);font-size:12px}.er{color:#c0392b}
dl{display:grid;grid-template-columns:76px 1fr;gap:3px 8px;margin:4px 0;align-items:center}dt{color:var(--mut)}dd{margin:0;word-break:break-all}dd input{width:100%}
.cc{border:2px solid var(--ln);padding:8px;border-radius:4px}.cc b{font-size:15px}.cc dl{margin:2px 0 0}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ln);margin:10px 0}.tabs button{border:0;border-radius:0;background:none;color:var(--mut);white-space:nowrap}.tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px var(--ac)}
fieldset{border:1px solid var(--ln);border-radius:4px;margin:6px 0;padding:6px}legend{font-size:12px;color:var(--mut)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:4px}.fg label,.g label{font-size:11px;color:var(--mut);display:block}.fg input,.g input{width:100%}.fg .w{grid-column:1/-1}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.tw{overflow-x:auto;margin:4px 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--ln);padding:1px}th{font-size:11px;font-weight:500;background:var(--bg);padding:3px;white-space:nowrap}
td input{border:0;background:transparent;width:100%;min-width:72px}td.n{padding:2px 6px;text-align:right;white-space:nowrap}.x{padding:0 6px}
.sm{display:flex;justify-content:space-between;padding:4px 8px;background:var(--bg);margin-top:3px}.sm b{color:var(--ac)}
.act{display:flex;gap:6px;margin-top:10px;position:sticky;bottom:-12px;background:var(--pn);padding:8px 0}
#lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 10px}
.li{display:flex;align-items:center;gap:6px;cursor:pointer}.li span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl{background:none;border:0;box-shadow:none;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;display:none}.jl:before{display:none}.lab .jl{display:block}
.rn{display:flex;gap:4px;padding:3px 6px;cursor:pointer;align-items:center}.rn:hover{background:var(--bg)}.rn i{width:10px;font-style:normal;color:var(--mut)}.rn span{flex:1}
.rn b{background:var(--ac);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:400}.rn.z{color:var(--mut);opacity:.6}.rn.on{outline:1px solid var(--ac)}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}#gate[hidden]{display:none}
#gate form{background:var(--pn);border:1px solid var(--ln);padding:24px;width:min(340px,90%);display:flex;flex-direction:column;gap:10px}
</style></head><body>
<div id="gate" hidden><form id="gf"><h3>보유 부동산 지도</h3><span class="m">접속코드를 입력하세요.</span><input type="password" id="code" autocomplete="current-password" aria-label="접속코드"><label class="m"><input type="checkbox" id="rmb" checked> 이 기기에서 기억</label><span id="ge" class="er"></span><button class="p">접속</button></form></div>
<div id="app">
<section id="mapcell"><div id="bar">
<input type="text" id="adr" value="경기도 광주시 탄벌동 214-4" aria-label="주소">
<button id="fnd">주소로 필지 찾기</button>
<label><input type="checkbox" id="add"> 필지 추가</label><label><input type="checkbox" id="mm"> 여러 필지 선택</label>
<button id="xl">엑셀 일괄 등록</button><button id="xt">양식 받기</button><input type="file" id="xf" accept=".xlsx,.xls" hidden>
<button id="exp">백업</button><button id="sy" hidden>동기화</button><button id="lo" hidden>나가기</button><button id="tp" title="우측 패널 접기/펼치기">◧</button>
<span id="msg" class="m"></span></div><div id="mw"><div id="rg"></div><div id="map"></div></div></section>
<div id="sp2" class="sp" title="드래그: 높이 조절 · 더블클릭: 초기화"></div><div id="sp1" class="sp" title="드래그: 너비 조절 · 더블클릭: 초기화"></div>
<section id="legend"><h3>범례 <span class="m" id="tot"></span></h3><div id="lg"></div></section>
<aside id="side"></aside>
</div>
<script>
/* ===== 설정: Supabase를 만든 뒤 아래 두 값을 채우면 서버 저장(모든 기기 공유)이 켜집니다 ===== */
const SB={url:'',key:''};
const KEY='48B105CA-7F59-416B-B845-479BD1FF7B3B',DOM='haneulkim-wonsang.github.io';
const ON=!!(SB.url&&SB.key);
const PAL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#008080','#9a6324','#800000','#808000','#000075','#ff69b4'];
const $=s=>document.querySelector(s),q=o=>Object.entries(o).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ko-KR'),num=v=>parseFloat(String(v).replace(/,/g,''))||0,won=n=>fmt(n)+'원',clone=o=>JSON.parse(JSON.stringify(o));
const msg=(m,e)=>{$('#msg').textContent=m;$('#msg').className=e?'er':'m'},nk=s=>String(s).replace(/\s/g,'');
/* ----- 저장소: 서버(Supabase) 또는 이 브라우저 ----- */
let DB={p:{},c:{},j:{}},CODE='',chain=Promise.resolve();
async function rpc(fn,body){const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
const t=await r.text();if(!r.ok){let m='';try{m=JSON.parse(t).message}catch(e){}throw new Error(/bad code/.test(m)?'접속코드가 맞지 않습니다':'서버 오류 '+r.status+' '+m)}return t?JSON.parse(t):null}
function put(items){if(!ON){try{localStorage.setItem('re_map2',JSON.stringify(DB))}catch(e){msg('저장 실패: 브라우저 저장 공간 부족',1)}return}
chain=chain.then(async()=>{for(let i=0;i<items.length;i+=40)await rpc('kv_put',{c:CODE,items:items.slice(i,i+40)});msg('서버에 저장했습니다')}).catch(e=>msg('서버 저장 실패: '+e.message,1))}
function del(ks){if(!ON)return put();chain=chain.then(()=>rpc('kv_del',{c:CODE,ks})).catch(e=>msg('서버 삭제 실패: '+e.message,1))}
const pc=()=>({k:'c',v:DB.c});
function fromRows(rows){DB={p:{},c:{},j:{}};rows.forEach(r=>{if(r.k=='c')DB.c=r.v;else if(r.k[0]=='p')DB.p[r.k.slice(2)]=r.v;else if(r.k[0]=='j')DB.j[r.k.slice(2)]=r.v})}
async function login(code,rem){const rows=await rpc('kv_list',{c:code});CODE=code;fromRows(rows);
try{(rem?localStorage:sessionStorage).setItem('re_code',code)}catch(e){}return rows.length}
/* ----- 지도 ----- */
let jc=0;
function jsonp(url){return new Promise((ok,no)=>{const n='__vw'+(++jc),s=document.createElement('script');
const cl=()=>{clearTimeout(t);delete window[n];s.remove()},t=setTimeout(()=>{cl();no(new Error('응답 시간 초과'))},20000);
window[n]=d=>{cl();ok(d)};s.onerror=()=>{cl();no(new Error('호출 실패: 인증키·도메인 또는 네트워크를 확인하세요'))};s.src=url+'&callback='+n;document.head.append(s)})}
const tl=(l,ext)=>L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${KEY}/${l}/{z}/{y}/{x}.${ext}`,{maxZoom:20,maxNativeZoom:19,attribution:'© VWorld'});
const base=tl('Base','png'),sat=tl('Satellite','jpeg'),hyb=tl('Hybrid','png');
const wms=L.tileLayer.wms('https://api.vworld.kr/req/wms',{layers:'lp_pa_cbnd_bubun',styles:'lp_pa_cbnd_bubun_line',format:'image/png',transparent:true,version:'1.3.0',key:KEY,domain:DOM,maxZoom:20});
const map=L.map('map',{layers:[base],center:[37.4229,127.2429],zoom:17});
L.control.layers({'일반지도':base,'위성지도':sat},{'지명(위성용)':hyb,'지적선(참고)':wms}).addTo(map);
map.on('zoomend',()=>map.getContainer().classList.toggle('lab',map.getZoom()>=18));
const reg=L.featureGroup().addTo(map);let LY={},cur=null,pj=null,tmpL=null,tab='land';const msel=new Set();
const NR=()=>({purpose:'소유권이전',rdate:'',rno:'',cdate:'',ctype:'',name:'',addr:'',reg:'',note:''});
function areaM2(g){const rings=g.type=='Polygon'?[g.coordinates]:g.coordinates,lat0=rings[0][0][0][1],kx=111320*Math.cos(lat0*Math.PI/180),ky=110540;
const sh=r=>{let s=0;for(let i=0;i<r.length-1;i++)s+=r[i][0]*kx*r[i+1][1]*ky-r[i+1][0]*kx*r[i][1]*ky;return Math.abs(s)/2};
return rings.reduce((t,p)=>t+sh(p[0])-p.slice(1).reduce((u,h)=>u+sh(h),0),0)}
const inRing=(pt,r)=>{let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[a,b]=r[i],[x,y]=r[j];if((b>pt[1])!=(y>pt[1])&&pt[0]<(x-a)*(pt[1]-b)/(y-b)+a)c=!c}return c};
const inside=(g,pt)=>(g.type=='Polygon'?[g.coordinates]:g.coordinates).some(p=>inRing(pt,p[0])&&!p.slice(1).some(h=>inRing(pt,h)));
function curOwner(p){const r=(p.owners||[]).map((o,i)=>[o,i]).filter(x=>x[0].name);if(!r.length)return null;
return r.sort((a,b)=>(b[0].rdate||'').localeCompare(a[0].rdate||'')||b[1]-a[1])[0][0]}
const colorOf=n=>DB.c[n]||(DB.c[n]=PAL[Object.keys(DB.c).length%PAL.length]);
const useArea=p=>+p.larea||p.area||0;
function sty(k){const o=curOwner(DB.p[k]),s=cur&&cur.key==k,m=msel.has(k);return{color:s?'#000':m?'#0066ff':'#222',weight:s?4:m?4:1.5,dashArray:m&&!s?'5':null,fillColor:colorOf(o.name),fillOpacity:.6}}
function drawAll(){reg.clearLayers();LY={};Object.entries(DB.p).forEach(([k,p])=>{if(!curOwner(p))return;
const ly=L.geoJSON(p.f,{style:sty(k)}).addTo(reg);ly.eachLayer(l=>l.options.bubblingMouseEvents=false);
ly.bindTooltip(p.f.properties.jibun||'',{permanent:true,direction:'center',className:'jl'});ly.on('click',()=>selReg(k));LY[k]=ly});legend();rgRender()}
function restyle(){Object.entries(LY).forEach(([k,l])=>l.setStyle(sty(k)));if(cur&&LY[cur.key])LY[cur.key].bringToFront()}
function legend(){const g={};Object.values(DB.p).forEach(p=>{const o=curOwner(p);if(!o)return;(g[o.name]??={n:0,a:0}).n++;g[o.name].a+=useArea(p)});
const ks=Object.keys(g).sort((a,b)=>g[b].a-g[a].a),ta=ks.reduce((s,k)=>s+g[k].a,0),tn=ks.reduce((s,k)=>s+g[k].n,0);
$('#tot').textContent=tn?`전체 ${tn}필지 · ${fmt(ta)}㎡ (${fmt(ta*.3025)}평)`:'';
$('#lg').innerHTML=ks.length?ks.map(k=>`<div class="li" data-own="${esc(k)}"><input type="color" data-c="${esc(k)}" value="${colorOf(k)}" aria-label="${esc(k)} 색상"><span>${esc(k)}</span><span class="m">${g[k].n}필지 · ${fmt(g[k].a)}㎡</span></div>`).join(''):'<span class="m">등록된 필지가 없습니다. 소유자 정보를 저장한 필지가 여기에 표시됩니다.</span>'}
function clearTmp(){if(tmpL){tmpL.remove();tmpL=null}}
const fixD=d=>{d.hist??=[];d.zone??={use:'',dist:'',bcr:'',far:'',etc:''};d.pbase??='';d.prices??=[];d.owners??=[];return d};
function selReg(k,nt){clearTmp();if($('#mm').checked&&!nt){msel.has(k)?msel.delete(k):msel.add(k)}cur={key:k,reg:true,d:fixD(clone(DB.p[k]))};pj=null;restyle();side()}
function selNew(f){const k=f.properties.pnu;if(DB.p[k]&&curOwner(DB.p[k]))return selReg(k);clearTmp();
tmpL=L.geoJSON(f,{style:{color:'#e11',weight:3,dashArray:'6',fillOpacity:.15}}).addTo(map);tmpL.eachLayer(l=>l.options.bubblingMouseEvents=false);
const m=/^(산?\d+(?:-\d+)?)(.*)$/.exec((f.properties.jibun||'').replace(/\s/g,''));
cur={key:k,reg:false,d:fixD({f,jm:m?m[2]:'',larea:'',note:'',area:areaM2(f.geometry),owners:[NR()]})};pj=null;restyle();side()}
async function fetchAt(lat,lng){const e=2e-5;const r=await jsonp('https://api.vworld.kr/req/data?'+q({service:'data',request:'GetFeature',data:'LP_PA_CBND_BUBUN',key:KEY,domain:DOM,format:'json',size:10,page:1,geometry:'true',attribute:'true',crs:'EPSG:4326',geomFilter:`BOX(${lng-e},${lat-e},${lng+e},${lat+e})`}));
if(r.response.status==='NOT_FOUND')return null;if(r.response.status!=='OK')throw new Error('필지 조회 실패: '+JSON.stringify(r.response.error||r.response.status));
const fs=r.response.result.featureCollection.features;return fs.find(f=>inside(f.geometry,[lng,lat]))||fs[0]}
async function pickAt(lat,lng){msg('필지 조회 중…');try{const f=await fetchAt(lat,lng);if(!f)return msg('해당 위치에 필지가 없습니다',1);selNew(f);msg('')}catch(x){msg(x.message,1)}}
const geo=async a=>{const g=await jsonp('https://api.vworld.kr/req/address?'+q({service:'address',request:'getCoord',version:'2.0',crs:'epsg:4326',address:a,refine:'true',simple:'false',format:'json',type:'PARCEL',key:KEY,domain:DOM}));
if(g.response.status!=='OK')throw new Error('주소를 찾지 못함');return[+g.response.result.point.y,+g.response.result.point.x]};
map.on('click',e=>{if($('#add').checked)pickAt(e.latlng.lat,e.latlng.lng)});
$('#fnd').onclick=async()=>{const a=$('#adr').value.trim();if(!a)return;msg('주소 검색 중…');try{const[y,x]=await geo(a);map.setView([y,x],19);await pickAt(y,x)}catch(e){msg(e.message,1)}};
$('#mm').onchange=()=>{if(!$('#mm').checked)msel.clear();restyle()};
/* ----- 우측 패널 ----- */
const TABS=[['land','토지'],['plan','도시계획'],['price','공시지가'],['own','소유권'],['dev','개발계획']];
const NEWR={hist:{date:'',jm:'',area:'',reason:''},prices:{year:'',price:'',date:''},owners:null,floors:{f:'',a:''},extra:{addr:'',area:'',jm:'',cost:''},permit:{kind:'',cdate:'',vendor:'',dep:'',prog:'',sched:''},cons:{kind:'',cdate:'',vendor:'',dep:'',prog:'',sched:''},taxes:{name:'',amt:''}};
const rt=k=>k.startsWith('J.')?[pj&&pj.d,k.slice(2).split('.')]:[cur&&cur.d,k.split('.')];
const getv=k=>{const[o,a]=rt(k);return a.reduce((x,y)=>x==null?x:x[y],o)};
const setv=(k,v)=>{const[o,a]=rt(k),l=a.pop();a.reduce((x,y)=>x[y],o)[l]=v};
const I=(k,t='text',ph='')=>`<input data-k="${k}" type="${t}" value="${esc(getv(k))}" placeholder="${ph}">`;
const LI=(l,k,t='text')=>`<label>${l}${I(k,t)}</label>`;
const T=(k,cols,tot)=>{const rows=getv(k)||[];return`<div class="tw"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${tot?'<th>합계</th>':''}<th></th></tr>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${I(k+'.'+i+'.'+c[0],c[2])}</td>`).join('')}${tot?`<td class="n" data-tot="${k}.${i}"></td>`:''}<td><button class="x" data-del="${k}.${i}" aria-label="행 삭제">×</button></td></tr>`).join('')}</table></div><button data-add="${k}">+ 행 추가</button>`};
const card=d=>{const o=curOwner(d);if(!o)return'<span class="m">권리자명을 입력하면 현재 권리자가 표시됩니다.</span>';
return`<div class="cc" style="border-color:${colorOf(o.name)}"><b>${esc(o.name)}</b><dl><dt>주소</dt><dd>${esc(o.addr)||'-'}</dd><dt>등록번호</dt><dd>${esc(o.reg)||'-'}</dd><dt>접수</dt><dd>${esc(o.rdate)||'-'} ${o.rno?'제'+esc(o.rno)+'호':''}</dd><dt>등기원인</dt><dd>${esc(o.cdate)||'-'} ${esc(o.ctype)}</dd><dt>등기목적</dt><dd>${esc(o.purpose)||'-'}</dd>${o.note?`<dt>기타</dt><dd>${esc(o.note)}</dd>`:''}</dl></div>`};
function side(){const el=$('#side');if(!cur){el.innerHTML='<p class="m">지도에서 색칠된 필지를 클릭하면 토지정보, 도시계획, 공시지가, 현재 권리자가 표시됩니다.<br><br>새 필지는 주소로 찾거나 「필지 추가」를 켜고 지도를 클릭한 뒤, 소유자 정보를 저장하면 등록됩니다. 여러 필지는 「엑셀 일괄 등록」을 쓰세요.</p>';return}
const p=cur.d.f.properties;
el.innerHTML=`<h3>${esc(p.addr)}</h3><div class="m">${cur.reg?'등록된 필지':'미등록 필지 · 소유자 입력 후 저장하면 지도에 등록됩니다'}</div><div id="cc" style="margin-top:6px">${card(cur.d)}</div>
<div class="tabs">${TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${l}</button>`).join('')}</div><div id="tb">${body()}</div>

Object.entries(A[pk]||{}).forEach(([k,n])=>{if(!m.has(k))m.set(k,{n,cd:cd[k]});else if(!m.get(k).cd)m.get(k).cd=cd[k]});
return[...m.entries()].sort((a,b)=>(c[b[0]]||0)-(c[a[0]]||0)||a[1].n.localeCompare(b[1].n,'ko'))};
const walk=(pk,lv)=>kids(pk,lv).forEach(([k,o])=>{const n=c[k]||0,op=RG.open[k];
out.push(`<div class="rn ${n?'':'z'} ${RG.sel==k?'on':''}" data-rk="${esc(k)}" data-lv="${lv}" data-cd="${o.cd||''}" style="padding-left:${6+lv*12}px"><i>${lv==2?'':op?'▾':'▸'}</i><span>${esc(o.n)}</span>${n?`<b>${n}</b>`:''}</div>`);
if(op&&lv<2)walk(k,lv+1)});walk('',0);$('#rg').innerHTML=out.join('')}
async function goRegion(k,lv,code){if(bnd){bnd.remove();bnd=null}
const ks=Object.entries(LY).filter(([pk])=>{let a='';return rgOf(DB.p[pk]).map(n=>a=rKey(a,n))[lv]==k}).map(x=>x[1]);
if(ks.length){map.fitBounds(L.featureGroup(ks).getBounds(),{maxZoom:18,padding:[30,30]});return}
if(lv<2){msg('이 지역에는 등록된 자산이 없습니다. 하위 지역을 펼쳐 선택하세요.');return}
$('#add').checked=true;cur=null;restyle();
$('#side').innerHTML='<h3>등록된 자산이 없는 지역</h3><p class="m">필지 추가 모드를 켰습니다. 지도에서 필지를 클릭해 소유자 정보를 입력하거나, 「엑셀 일괄 등록」으로 한 번에 등록하세요.</p>';
if(!code)return msg('지역 코드를 알 수 없어 지도를 이동하지 못했습니다',1);msg('지역 경계 조회 중…');
try{const r=await jsonp('https://api.vworld.kr/req/data?'+q({service:'data',request:'GetFeature',data:'LT_C_ADEMD_INFO',key:KEY,domain:DOM,format:'json',size:10,page:1,geometry:'true',attribute:'true',crs:'EPSG:4326',attrFilter:'emd_cd:=:'+code}));
if(r.response.status!=='OK')throw new Error('경계 조회 실패 '+r.response.status);bnd=L.geoJSON(r.response.result.featureCollection,{style:{color:'#888',weight:2,dashArray:'6',fill:false},interactive:false}).addTo(map);map.fitBounds(bnd.getBounds());msg('')}
catch(x){msg(x.message,1)}}
document.addEventListener('click',e=>{const r=e.target.closest('.rn');if(!r)return;const k=r.dataset.rk,lv=+r.dataset.lv,cdv=r.dataset.cd;RG.sel=k;
if(lv<2){RG.open[k]=!RG.open[k];if(RG.open[k]&&cdv)loadKids(k,cdv,lv)}goRegion(k,lv,cdv);rgRender()});
function fitAll(){if(reg.getLayers().length)map.fitBounds(reg.getBounds(),{maxZoom:18,padding:[30,30]})}
/* ===== 화면 분할 크기 조절 ===== */
let LAY={};try{LAY=JSON.parse(localStorage.getItem('re_lay'))||{}}catch(e){}
const dfl=()=>({rw:Math.round(innerWidth*.26),lh:Math.round(innerHeight*.22)});
function applyLay(){const a=$('#app').style,d=dfl();a.setProperty('--rw',(LAY.hide?0:LAY.rw||d.rw)+'px');a.setProperty('--lh',(LAY.lh||d.lh)+'px');map.invalidateSize()}
function drag(el,fn,key){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);const mv=ev=>{fn(ev);LAY.hide=false;applyLay()},up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);try{localStorage.setItem('re_lay',JSON.stringify(LAY))}catch(x){}};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)});
el.addEventListener('dblclick',()=>{delete LAY[key];LAY.hide=false;applyLay();try{localStorage.setItem('re_lay',JSON.stringify(LAY))}catch(x){}})}
drag($('#sp1'),e=>LAY.rw=Math.round(Math.min(innerWidth*.75,Math.max(240,innerWidth-e.clientX))),'rw');
drag($('#sp2'),e=>{const r=$('#app').getBoundingClientRect();LAY.lh=Math.round(Math.min(r.height*.7,Math.max(60,r.bottom-e.clientY)))},'lh');
$('#tp').onclick=()=>{LAY.hide=!LAY.hide;applyLay();try{localStorage.setItem('re_lay',JSON.stringify(LAY))}catch(x){}};
addEventListener('resize',applyLay);applyLay();
/* ===== 시작 ===== */
function boot(){drawAll();side();fitAll()}
async function start(){
if(!ON){try{DB=JSON.parse(localStorage.getItem('re_map2')||localStorage.getItem('re_map1'))||DB}catch(e){}DB.j??={};DB.c??={};msg('서버 미설정: 이 브라우저에만 저장됩니다',1);return boot()}
$('#sy').hidden=$('#lo').hidden=false;
const sv=localStorage.getItem('re_code')||sessionStorage.getItem('re_code');
if(sv)try{await login(sv,!!localStorage.getItem('re_code'));return boot()}catch(e){}
$('#gate').hidden=false}
$('#gf').onsubmit=async e=>{e.preventDefault();$('#ge').textContent='';try{await login($('#code').value,$('#rmb').checked);$('#gate').hidden=true;boot();
try{const old=JSON.parse(localStorage.getItem('re_map2')||localStorage.getItem('re_map1'));const ks=old&&old.p?Object.keys(old.p).filter(k=>!DB.p[k]):[];
if(ks.length&&confirm(`이 브라우저에 저장된 필지 ${ks.length}개가 서버에 없습니다. 서버로 올릴까요?`)){ks.forEach(k=>DB.p[k]=old.p[k]);Object.assign(DB.c,old.c||{});put(ks.map(k=>({k:'p:'+k,v:DB.p[k]})).concat(pc()));drawAll()}}catch(x){}}
catch(x){$('#ge').textContent=x.message}};
$('#sy').onclick=async()=>{try{await login(CODE,!!localStorage.getItem('re_code'));cur=null;boot();msg('서버 데이터로 새로고침했습니다')}catch(x){msg(x.message,1)}};
$('#lo').onclick=()=>{try{localStorage.removeItem('re_code');sessionStorage.removeItem('re_code')}catch(e){}location.reload()};
start();
</script></body></html>
